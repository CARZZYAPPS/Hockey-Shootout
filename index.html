<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hockey Shootout - Cyber Edition</title>
    <style>
        /* Updated to match your 0a0a0a and 00b1d2 theme */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #00b1d2; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            user-select: none; 
            margin: 0; 
            padding: 20px; 
        }

        #stats { 
            width: 600px; 
            display: flex; 
            justify-content: space-between; 
            background: #111; 
            padding: 15px; 
            border-radius: 4px; 
            box-shadow: 0 0 15px rgba(0, 177, 210, 0.2); 
            margin-bottom: 15px; 
            border: 1px solid #00b1d2; 
        }

        #rink { 
            width: 600px; height: 400px; 
            background: #0a0a0a; 
            border: 2px solid #00b1d2; 
            position: relative; 
            cursor: crosshair; 
            overflow: hidden; 
            border-radius: 8px;
        }

        #net { 
            width: 400px; height: 220px; 
            border: 3px solid #00b1d2; 
            border-bottom: none;
            position: absolute; top: 10px; left: 100px; 
            background: rgba(0, 177, 210, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 177, 210, 0.1);
        }

        #goalie { 
            width: 45px; height: 60px; 
            background: #00b1d2; 
            border-radius: 2px; 
            position: absolute; top: 140px; left: 277px; z-index: 10;
            transition: all 0.4s ease-out;
            box-shadow: 0 0 10px #00b1d2;
        }

        #puck { 
            width: 20px; height: 20px; 
            background: #fff; 
            border-radius: 50%; 
            position: absolute; bottom: 30px; left: 290px; z-index: 5;
            box-shadow: 0 0 8px #fff;
        }

        #power-container { 
            width: 610px; height: 8px; 
            background: #1a1a1a; 
            margin-top: 15px; 
            border-radius: 0; 
            overflow: hidden; 
            border: 1px solid #333;
        }

        #power-bar { 
            width: 0%; height: 100%; 
            background: #00b1d2; 
            box-shadow: 0 0 10px #00b1d2;
        }

        .val { color: #fff; font-weight: bold; }
        #msg { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            font-weight: 600; 
            color: #00b1d2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="stats">
        <div>GOALS: <span id="current" class="val">0</span> / 10</div>
        <div style="font-weight: 800;">EASY MODE</div>
        <div>BEST: <span id="record" class="val">0</span></div>
    </div>

    <div id="rink" onmousedown="startCharge()" onmouseup="releaseShot(event)">
        <div id="net"></div>
        <div id="goalie"></div>
        <div id="puck"></div>
    </div>

    <div id="power-container"><div id="power-bar"></div></div>
    <div id="msg">HOLD & RELEASE TO SHOOT</div>

    <script>
        let score = 0, shotsTaken = 0, power = 0, isCharging = false, isShooting = false;
        let chargeInterval;

        const goalie = document.getElementById('goalie');
        const puck = document.getElementById('puck');
        const powerBar = document.getElementById('power-bar');
        const msg = document.getElementById('msg');

        let record = localStorage.getItem('hockey_easy_v1') || 0;
        document.getElementById('record').textContent = record;

        function startCharge() {
            if (isShooting || shotsTaken >= 10) return;
            isCharging = true;
            power = 0;
            chargeInterval = setInterval(() => {
                if (power < 100) { power += 4; powerBar.style.width = power + '%'; }
            }, 25);
        }

        function releaseShot(e) {
            if (!isCharging) return;
            clearInterval(chargeInterval);
            isCharging = false;
            isShooting = true;
            shotsTaken++;

            const rect = document.getElementById('rink').getBoundingClientRect();
            let tx = e.clientX - rect.left;
            let ty = e.clientY - rect.top;

            puck.style.transition = `all 0.6s cubic-bezier(0.1, 0.5, 0.5, 1)`;
            
            setTimeout(() => {
                const laziness = (Math.random() * 80 - 40); 
                goalie.style.left = (tx - 22 + laziness) + 'px';
                goalie.style.top = Math.max(60, Math.min(150, ty - 30)) + 'px';
                setTimeout(() => checkResult(tx, ty), 300);
            }, 300); 

            puck.style.left = (tx - 10) + 'px';
            puck.style.top = (ty - 10) + 'px';
        }

        function checkResult(px, py) {
            const gx = parseFloat(goalie.style.left) + 22;
            const gy = parseFloat(goalie.style.top) + 30;
            const dist = Math.hypot(px - gx, py - gy);
            const inNet = px > 100 && px < 500 && py > 10 && py < 230;

            if (dist < 35) {
                msg.textContent = "🧤 Saved! Try the corners!";
            } else if (inNet) {
                score++;
                msg.textContent = "🚨 GOAL!! NICE SHOT!";
            } else {
                msg.textContent = "❌ Out of the net!";
            }

            document.getElementById('current').textContent = score;
            setTimeout(() => {
                powerBar.style.width = '0%';
                reset();
                if (shotsTaken === 10) endGame();
            }, 1000);
        }

        function reset() {
            puck.style.transition = 'none';
            puck.style.left = '290px'; puck.style.top = '350px';
            goalie.style.top = '140px'; goalie.style.left = '277px';
            isShooting = false;
        }

        function endGame() {
            if (score > record) localStorage.setItem('hockey_easy_v1', score);
            alert(`SESSION COMPLETE\nSCORE: ${score}/10`);
            location.reload();
        }
    </script>
</body>
</html>
